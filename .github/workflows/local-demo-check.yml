name: Verify Docker local demo
on:
  pull_request:
    paths: ['demo/**', 'compose.yaml', 'firebase.demo.json', 'firebase/**', 'scripts/**', 'apps/portal/**', '.dockerignore', '.github/workflows/local-demo-check.yml']
  push:
    branches: [main]
    paths: ['demo/**', 'compose.yaml', 'firebase.demo.json', 'firebase/**', 'scripts/**', 'apps/portal/**', '.dockerignore', '.github/workflows/local-demo-check.yml']
permissions:
  contents: read
concurrency:
  group: docker-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start demo
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Verify portal and location attendance
        run: |
          curl --fail http://localhost:3000/login > /dev/null
          docker compose exec -T -e DEMO_SMOKE_STATE=/data/smoke.json backend node demo/smoke.mjs
      - name: Recreate demo with saved data
        run: |
          docker compose down
          docker compose up -d --wait --wait-timeout 300
          docker compose exec -T -e DEMO_SMOKE_STATE=/data/smoke.json backend node demo/smoke.mjs --verify-persistence
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down -v
