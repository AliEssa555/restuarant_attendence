name: restaurant-demo
services:
  backend:
    build:
      context: .
      dockerfile: demo/Dockerfile.backend
    ports:
      - "9099:9099"
      - "8080:8080"
      - "5001:5001"
      - "127.0.0.1:4000:4000"
    volumes:
      - demo-data:/data
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "node", "demo/healthcheck.mjs"]
      interval: 5s
      timeout: 4s
      retries: 60
      start_period: 30s
  portal:
    build:
      context: .
      dockerfile: demo/Dockerfile.portal
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  demo-data:
